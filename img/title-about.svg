<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="01 About - Hello, I'm 0noxtackore.">
  <defs>
    <linearGradient id="tv-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".6" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1E40AF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tv-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="tv-pulse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .tv-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tv-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tv-in { animation: tv-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tv-d2 { animation-delay: .2s; }
    .tv-d3 { animation-delay: .45s; }
    .tv-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tv-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tv-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tv-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tv-in { animation: none; } .tv-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tv-in">
    <text class="tv-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#60A5FA"><tspan fill="#93C5FD">01</tspan>   ABOUT</text>
  </g>
  <g class="tv-in tv-d2">
    <text class="tv-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F8FAFC">Hello, I&#x27;m <tspan font-style="italic" fill="url(#tv-sheen)">0noxtackore</tspan> 👋</text>
  </g>
  <g class="tv-in tv-d3">
    <text class="tv-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#9CA3AF">WHO I AM</text>
  </g>
  <path class="tv-draw" d="M40 106 H1160" stroke="url(#tv-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#tv-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
