<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About 0noxtackore</title>
  <desc id="ab-d">0noxtackore - builder of web apps, games and developer tools.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#05070D"/></linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#4169E1" stop-opacity=".55"/><stop offset="1" stop-color="#1E40AF" stop-opacity="0"/></radialGradient>
    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#60A5FA" opacity=".05"/></pattern>
    <clipPath id="ab-c0"><rect class="ab-type" x="68" y="112" width="70" height="22" style="animation-delay:0.60s;animation-duration:0.41s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c1"><rect class="ab-type" x="72" y="137" width="340" height="22" style="animation-delay:1.16s;animation-duration:0.53s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c2"><rect class="ab-type" x="68" y="162" width="125" height="22" style="animation-delay:2.04s;animation-duration:0.56s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c3"><rect class="ab-type" x="68" y="187" width="700" height="22" style="animation-delay:2.75s;animation-duration:0.53s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c4"><rect class="ab-type" x="68" y="212" width="100" height="22" style="animation-delay:3.63s;animation-duration:0.59s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c5"><rect class="ab-type" x="68" y="237" width="600" height="22" style="animation-delay:4.37s;animation-duration:0.53s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c6"><rect class="ab-type" x="68" y="262" width="600" height="22" style="animation-delay:5.25s;animation-duration:0.41s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c7"><rect class="ab-type" x="68" y="287" width="130" height="22" style="animation-delay:5.81s;animation-duration:0.53s;animation-timing-function:steps(4)"/></clipPath>
    <clipPath id="ab-c8"><rect class="ab-type" x="68" y="312" width="400" height="22" style="animation-delay:6.69s;animation-duration:0.49s;animation-timing-function:steps(4)"/></clipPath>
  </defs>
  <style>
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ab-type { transform-box: fill-box; transform-origin: left center; animation-name: ab-type; animation-fill-mode: both; }
    .ab-card { animation: ab-in 1s cubic-bezier(.16,1,.3,1) both; }
    .ab-fade { animation: ab-fade 1s ease both; }
    @keyframes ab-type { 0% { transform: scaleX(0); } 85%, 100% { transform: scaleX(1); } }
    @keyframes ab-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes ab-fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ab-type, .ab-card, .ab-fade { animation: none; } }
  </style>
  <rect width="1200" height="420" rx="20" fill="url(#ab-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ab-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#60A5FA" stroke-opacity=".16"/>

  <g class="ab-fade">
    <rect x="40" y="40" width="760" height="340" rx="14" fill="#0B1120" stroke="#1E40AF" stroke-opacity=".3"/>
    <rect x="40" y="40" width="760" height="340" rx="14" fill="url(#ab-scan)"/>
    <path d="M40 54 a14 14 0 0 1 14 -14 H786 a14 14 0 0 1 14 14 V76 H40 Z" fill="#0A0F1C"/>
    <line x1="40" y1="76" x2="800" y2="76" stroke="#1E40AF" stroke-opacity=".2"/>
    <circle cx="62" cy="58" r="5" fill="#1E40AF"/>
    <circle cx="80" cy="58" r="5" fill="#2A4BC7"/>
    <circle cx="98" cy="58" r="5" fill="#3B82F6"/>
    <text class="ab-mono" x="420" y="62" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#9CA3AF">0noxtackore@noxtackore ~ % ./about.sh</text>
  </g>

  <g class="ab-mono" font-size="13.5">
    <g clip-path="url(#ab-c0)"><text x="72" y="128" fill="#60A5FA">$</text><text x="94" y="128" fill="#F8FAFC">whoami</text></g>
    <g clip-path="url(#ab-c1)"><text x="72" y="153" fill="#3B82F6">→</text><text x="94" y="153" fill="#9CA3AF">0noxtackore · web · game · tool builder</text></g>
    <g clip-path="url(#ab-c2)"><text x="72" y="178" fill="#60A5FA">$</text><text x="94" y="178" fill="#F8FAFC">cat ./stack.txt</text></g>
    <g clip-path="url(#ab-c3)"><text x="72" y="203" fill="#3B82F6">→</text><text x="94" y="203" fill="#9CA3AF">Languages · Frontend · Backend · Data · Infra · AI/ML · Cloud</text></g>
    <g clip-path="url(#ab-c4)"><text x="72" y="228" fill="#60A5FA">$</text><text x="94" y="228" fill="#F8FAFC">ls ./shipped</text></g>
    <g clip-path="url(#ab-c5)"><text x="72" y="253" fill="#3B82F6">→</text><text x="94" y="253" fill="#9CA3AF">Radio-Ebenezer-Online · Servi-Wash · Ebenezer-Screen</text></g>
    <g clip-path="url(#ab-c6)"><text x="72" y="278" fill="#3B82F6">→</text><text x="94" y="278" fill="#9CA3AF">Fluffy-Adventures · OnoxFri · Onofrietti-Comics · Lithay-Catalog</text></g>
    <g clip-path="url(#ab-c7)"><text x="72" y="303" fill="#60A5FA">$</text><text x="94" y="303" fill="#F8FAFC">echo $PRINCIPLE</text></g>
    <g clip-path="url(#ab-c8)"><text x="72" y="328" fill="#3B82F6">→</text><text x="94" y="328" fill="#9CA3AF">systems that hold up · experiences worth using</text></g>
  </g>

  <g class="ab-card" style="animation-delay:1.2s"><g transform="translate(836 70)">
    <rect width="324" height="88" rx="14" fill="#0A0F1C" stroke="#1E40AF" stroke-opacity=".28"/>
    <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#1E40AF"/>
    <text class="ab-mono" x="22" y="26" font-size="10" letter-spacing="2" fill="#60A5FA">PRIMARY LANGUAGE</text>
    <text class="ab-serif" x="22" y="58" font-size="28" font-weight="300" fill="#F8FAFC">Java</text>
    <text class="ab-sans" x="22" y="78" font-size="12" fill="#9CA3AF">AI · Systems · Web</text>
  </g></g>
  <g class="ab-card" style="animation-delay:1.7s"><g transform="translate(836 174)">
    <rect width="324" height="88" rx="14" fill="#0A0F1C" stroke="#1E40AF" stroke-opacity=".28"/>
    <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#1E40AF"/>
    <text class="ab-mono" x="22" y="26" font-size="10" letter-spacing="2" fill="#60A5FA">MAIN STACK</text>
    <text class="ab-serif" x="22" y="58" font-size="28" font-weight="300" fill="#F8FAFC">Full-Stack</text>
    <text class="ab-sans" x="22" y="78" font-size="12" fill="#9CA3AF">Web · Mobile · Game</text>
  </g></g>
  <g class="ab-card" style="animation-delay:2.2s"><g transform="translate(836 278)">
    <rect width="324" height="88" rx="14" fill="#0A0F1C" stroke="#1E40AF" stroke-opacity=".28"/>
    <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#1E40AF"/>
    <text class="ab-mono" x="22" y="26" font-size="10" letter-spacing="2" fill="#60A5FA">THE PRINCIPLE</text>
    <text class="ab-serif" x="22" y="58" font-size="28" font-weight="300" fill="#F8FAFC">Ship it.</text>
    <text class="ab-sans" x="22" y="78" font-size="12" fill="#9CA3AF">Simple systems, real users</text>
  </g></g>

  <rect x="72" y="352" width="8" height="16" fill="#60A5FA" class="ab-fade" style="animation-delay:8.2s">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
